<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Góc thư tay 💌</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="max-width: 900px;">
        <h1>Góc thư tay</h1>
        <p class="subtitle">Những lời muốn nói gửi đến {{ her_name }}</p>

        <!-- Sử dụng chung class gallery-grid để có giao diện giống trang ảnh chung -->
        <div class="gallery-grid">
            {% for img in images %}
                <!-- Bấm vào ảnh sẽ mở ra tab mới với kích thước lớn -->
                <a href="{{ url_for('static', filename='letters/' + img) }}" target="_blank">
                    <img src="{{ url_for('static', filename='letters/' + img) }}" alt="Thư tay">
                </a>
            {% else %}
                <p>Chưa có bức thư nào trong thư mục này.</p>
            {% endfor %}
        </div>

        <a href="/" class="back-btn" style="margin-top: 20px;">← Về trang chủ</a>
    </div>
</body>
</html>
